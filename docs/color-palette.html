<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>amoxtli-vue-2 · color palette</title>
    <style>
      :root {
        --page: #fcfcfc;
        --panel: #ffffff;
        --ink: #324a62;
        --ink-soft: #6c6867;
        --line: #e5e7eb;
        --line-soft: #f0f0f0;
        --accent: #eca342;
        --chip-shadow: 0 1px 2px rgb(0 0 0 / 8%), 0 0 0 1px rgb(0 0 0 / 6%) inset;
        --radius: 12px;
        color-scheme: light;
      }
      html[data-theme='dark'] {
        --page: #0b0c07;
        --panel: #14140f;
        --ink: #f5f5f5;
        --ink-soft: #a7a4a3;
        --line: #2a2a22;
        --line-soft: #211c1a;
        --accent: #e4007c;
        --chip-shadow: 0 1px 2px rgb(0 0 0 / 50%), 0 0 0 1px rgb(255 255 255 / 10%) inset;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        transition:
          background 0.25s ease,
          color 0.25s ease;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      }

      header.bar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      .bar-inner {
        max-width: 1180px;
        margin: 0 auto;
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 15px;
        margin: 0;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      h1 span {
        color: var(--ink-soft);
        font-weight: 400;
      }
      .spacer {
        flex: 1 1 auto;
      }

      input[type='search'] {
        flex: 1 1 200px;
        max-width: 280px;
        padding: 7px 11px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        font: inherit;
        outline: none;
      }
      input[type='search']:focus-visible {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent);
      }

      .seg {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 9px;
        overflow: hidden;
        background: var(--panel);
      }
      .seg button {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--ink-soft);
        padding: 7px 11px;
        font: inherit;
        cursor: pointer;
      }
      .seg button + button {
        border-left: 1px solid var(--line);
      }
      .seg button[aria-pressed='true'] {
        background: var(--accent);
        color: #fff;
      }
      html[data-theme='dark'] .seg button[aria-pressed='true'] {
        color: #fff;
      }

      .btn {
        appearance: none;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        padding: 7px 11px;
        border-radius: 9px;
        font: inherit;
        cursor: pointer;
      }
      .btn:hover {
        border-color: var(--accent);
      }
      .btn:focus-visible,
      .swatch:focus-visible,
      .seg button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px 20px 96px;
      }

      section {
        margin: 0 0 34px;
      }
      .sec-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 4px;
      }
      .sec-head h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        margin: 0;
        font-weight: 650;
      }
      .sec-head .file {
        color: var(--ink-soft);
        font-size: 12px;
      }
      .note {
        color: var(--ink-soft);
        font-size: 12.5px;
        margin: 0 0 14px;
        max-width: 78ch;
      }
      .note code {
        background: color-mix(in srgb, var(--ink) 8%, transparent);
        padding: 1px 5px;
        border-radius: 5px;
        font-size: 12px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(162px, 1fr));
        gap: 10px;
      }

      .swatch {
        position: relative;
        display: block;
        width: 100%;
        text-align: left;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
        border-radius: var(--radius);
      }
      .swatch .chip {
        height: 74px;
        border-radius: var(--radius);
        box-shadow: var(--chip-shadow);
        transition: transform 0.12s ease;
      }
      .swatch:hover .chip {
        transform: translateY(-2px);
      }
      .swatch .meta {
        padding: 7px 2px 0;
        display: grid;
        gap: 1px;
      }
      .swatch .stop {
        font-weight: 600;
        font-size: 12.5px;
      }
      .swatch .hex {
        font-size: 12px;
        color: var(--ink);
        opacity: 0.82;
      }
      .swatch .raw {
        font-size: 10.5px;
        color: var(--ink-soft);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .swatch .varname {
        font-size: 10.5px;
        color: var(--ink-soft);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .swatch .done {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        border-radius: var(--radius);
        background: color-mix(in srgb, var(--ink) 62%, transparent);
        color: var(--page);
        font-weight: 650;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s ease;
      }
      .swatch.copied .done {
        opacity: 1;
      }

      .empty {
        color: var(--ink-soft);
        padding: 24px 0;
      }

      footer {
        color: var(--ink-soft);
        font-size: 12px;
        border-top: 1px solid var(--line);
        padding-top: 16px;
      }
      footer code {
        background: color-mix(in srgb, var(--ink) 8%, transparent);
        padding: 1px 5px;
        border-radius: 5px;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 26px;
        transform: translate(-50%, 12px);
        background: var(--ink);
        color: var(--page);
        padding: 9px 16px;
        border-radius: 999px;
        font-size: 12.5px;
        font-weight: 550;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.18s ease,
          transform 0.18s ease;
        z-index: 50;
        max-width: 90vw;
        text-align: center;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    </style>
  </head>

      </div>
    </header>

        <code>shortcuts</code> block and <code>styles/base.css</code>. Hex values are resolved live from the
        <code>oklch()</code> definitions. Syntax-highlighting themes are separate:
        <code>themes/amoxtli-light.ts</code> (light) and Shiki's <code>vesper</code> (dark).
      </p>
    </footer>

    <script>
      'use strict'

      /* ---------- resolve any CSS color to a copyable string ---------- */
      const _cv = document.createElement('canvas')
      _cv.width = _cv.height = 1
      const _ctx = _cv.getContext('2d', { willReadFrequently: true })
      const _h2 = (n) => Math.round(n).toString(16).padStart(2, '0')

      /** Any CSS color -> { r,g,b,a } in 0..255, via canvas pixel read. */
      function sample(color) {
        _ctx.clearRect(0, 0, 1, 1)
        _ctx.fillStyle = color
        _ctx.fillRect(0, 0, 1, 1)
        const d = _ctx.getImageData(0, 0, 1, 1).data
        return { r: d[0], g: d[1], b: d[2], a: d[3] }
      }

      function resolve(color) {
        try {
          _ctx.fillStyle = '#000'
          _ctx.fillStyle = color
          const out = _ctx.fillStyle
          if (typeof out === 'string' && out !== '#000') return out
        } catch (e) {
          /* fall through to pixel sampling */
        }
        const { r, g, b, a } = sample(color)
        return a === 255 ? `rgb(${r}, ${g}, ${b})` : `rgba(${r}, ${g}, ${b}, ${(a / 255).toFixed(3)})`
      }

      function toHex(color) {
        const r = resolve(color)
        let m = r.match(/^#([0-9a-f]{6})$/i)
        if (m) return r.toLowerCase()
        m = r.match(/^rgba?\(([^)]+)\)$/i)
        if (m) {
          const p = m[1].split(/[\s,\/]+/).filter(Boolean)
          let out = '#' + _h2(parseFloat(p[0])) + _h2(parseFloat(p[1])) + _h2(parseFloat(p[2]))
          if (p[3] !== undefined && parseFloat(p[3]) < 1) out += _h2(parseFloat(p[3]) * 255)
          return out.toLowerCase()
        }
        const { r: rr, g: gg, b: bb, a: aa } = sample(color)
        let out = '#' + _h2(rr) + _h2(gg) + _h2(bb)
        if (aa < 255) out += _h2(aa)
        return out.toLowerCase()
      }

      /* ---------- palette data (verbatim from uno.config.ts) ---------- */
      const vars = (name, stop) => (stop === 'DEFAULT' ? `--colors-${name}` : `--colors-${name}-${stop}`)

        return { stop, value, varname: vars(name, stop) }

          swatches: [
            family('challenge', '50', 'oklch(98% 0.016 73.684)'),
            family('challenge', '100', 'oklch(95.4% 0.038 75.164)'),
            family('challenge', '200', 'oklch(90.1% 0.076 70.697)'),
            family('challenge', '300', 'oklch(83.7% 0.128 66.29)'),
            family('challenge', '400', 'oklch(75% 0.183 55.934)'),
            family('challenge', '500', 'oklch(70.5% 0.213 47.604)'),
            family('challenge', '600', 'oklch(64.6% 0.222 41.116)'),
            family('challenge', '700', 'oklch(55.3% 0.195 38.402)'),
            family('challenge', '800', 'oklch(47% 0.157 37.304)'),
            family('challenge', '900', 'oklch(40.8% 0.123 38.172)'),
            family('challenge', '950', 'oklch(26.6% 0.079 36.259)'),
            family('challenge', 'dark', 'oklch(26.6% 0.079 36.259)'),
          ],
        },
      ]

      /* ---------- render ---------- */
      const main = document.getElementById('main')
      const state = { fmt: 'hex', q: '' }

      for (const sec of SECTIONS) {
        const el = document.createElement('section')
        el.dataset.search = (
          sec.title +
          ' ' +
          sec.swatches.map((s) => s.stop + ' ' + s.sub + ' ' + s.value).join(' ')
        ).toLowerCase()

        const head = document.createElement('div')
        head.className = 'sec-head'
        const h2 = document.createElement('h2')
        h2.textContent = sec.title
        const f = document.createElement('span')
        f.className = 'file mono'
        f.textContent = sec.file
        head.append(h2, f)

        const note = document.createElement('p')
        note.className = 'note'
        note.innerHTML = sec.note

        const grid = document.createElement('div')
        grid.className = 'grid'

        for (const s of sec.swatches) {
          const hex = toHex(s.value)
          const label = s.sub ? `${sec.title} · ${s.stop} (${s.sub})` : `${sec.title} · ${s.stop}`

          const btn = document.createElement('button')
          btn.type = 'button'
          btn.className = 'swatch'
          btn.dataset.search = (
            sec.title +
            ' ' +
            s.stop +
            ' ' +
            (s.sub || '') +
            ' ' +
            s.value +
            ' ' +
            hex +
            ' ' +
            (s.varname || '')
          ).toLowerCase()
          btn.dataset.hex = hex
          btn.dataset.oklch = s.value
          btn.dataset.varname = s.varname || ''
          btn.setAttribute('aria-label', `Copy ${hex} — ${label}`)

          const chip = document.createElement('div')
          chip.className = 'chip'
          chip.style.background = s.value

          const meta = document.createElement('div')
          meta.className = 'meta'

          const stop = document.createElement('div')
          stop.className = 'stop'
          stop.textContent = s.stop

          const hexEl = document.createElement('div')
          hexEl.className = 'hex mono'
          hexEl.textContent = hex

          const raw = document.createElement('div')
          raw.className = 'raw mono'
          raw.textContent = s.value

          meta.append(stop)
          if (s.sub) {
            const sub = document.createElement('div')
            sub.className = 'varname mono'
            sub.textContent = s.sub
            meta.append(sub)
          }
          meta.append(hexEl, raw)

          if (s.varname) {
            const vn = document.createElement('div')
            vn.className = 'varname mono'
            vn.textContent = s.varname
            meta.append(vn)
          }

          const done = document.createElement('span')
          done.className = 'done'
          done.textContent = 'copied ✓'

          btn.append(chip, meta, done)
          btn.addEventListener('click', () => onCopy(btn, s.varname))
          grid.append(btn)
        }

        el.append(head, note, grid)
        main.append(el)
      }

      /* ---------- copy ---------- */
      const toastEl = document.getElementById('toast')
      let toastTimer
      function toast(msg) {
        toastEl.textContent = msg
        toastEl.classList.add('show')
        clearTimeout(toastTimer)
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800)
      }

      async function write(text) {
        try {
          await navigator.clipboard.writeText(text)
          return true
        } catch (e) {
          const ta = document.createElement('textarea')
          ta.value = text
          ta.style.position = 'fixed'
          ta.style.opacity = '0'
          document.body.append(ta)
          ta.select()
          let ok = false
          try {
            ok = document.execCommand('copy')
          } catch (_) {}
          ta.remove()
          return ok
        }
      }

      function valueFor(btn) {
        if (state.fmt === 'oklch') return btn.dataset.oklch
        if (state.fmt === 'var') {
          return btn.dataset.varname ? `var(${btn.dataset.varname})` : btn.dataset.hex
        }
        return btn.dataset.hex
      }

      async function onCopy(btn, varname) {
        let text = valueFor(btn)
        if (state.fmt === 'var' && !varname) text = btn.dataset.hex
        const ok = await write(text)
        toast(ok ? `Copied ${text}` : `Copy failed — select manually: ${text}`)
        btn.classList.add('copied')
        setTimeout(() => btn.classList.remove('copied'), 750)
      }

      /* ---------- format toggle ---------- */
      for (const b of document.querySelectorAll('.seg button')) {
        b.addEventListener('click', () => {
          state.fmt = b.dataset.fmt
          document.querySelectorAll('.seg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)))
          toast(`Copy format: ${b.textContent}`)
        })
      }

      /* ---------- filter ---------- */
      const filterInput = document.getElementById('filter')
      filterInput.addEventListener('input', () => {
        const q = filterInput.value.trim().toLowerCase()
        let visibleSections = 0,
          total = 0
        for (const sec of main.children) {
          const btns = sec.querySelectorAll('.swatch')
          let shown = 0
          for (const b of btns) {
            const hit = !q || b.dataset.search.includes(q)
            b.style.display = hit ? '' : 'none'
            if (hit) shown++
          }
          const secHit = !q || sec.dataset.search.includes(q)
          sec.style.display = q && shown === 0 && !secHit ? 'none' : ''
          if (sec.style.display !== 'none') {
            visibleSections++
            total += shown
          }
        }
        let empty = document.getElementById('empty')
        if (!total) {
          if (!empty) {
            empty = document.createElement('p')
            empty.id = 'empty'
            empty.className = 'empty'
            empty.textContent = 'No colors match that filter.'
            main.prepend(empty)
          }
        } else if (empty) empty.remove()
      })

      /* ---------- bulk copy ---------- */
      function allSwatches() {
        return [...main.querySelectorAll('.swatch')]
      }
      document.getElementById('copy-css').addEventListener('click', async () => {
        const lines = [':root {']
        for (const b of allSwatches()) {
          if (!b.dataset.varname) continue
          lines.push(`  ${b.dataset.varname}: ${b.dataset.oklch};`)
        }
        lines.push('}')
        const ok = await write(lines.join('\n'))
        toast(ok ? `Copied ${lines.length - 2} CSS variables` : 'Copy failed')
      })
      document.getElementById('copy-json').addEventListener('click', async () => {
        const out = {}
        for (const b of allSwatches()) {
          if (!b.dataset.varname) continue
          out[b.dataset.varname] = { hex: b.dataset.hex, oklch: b.dataset.oklch }
        }
        const ok = await write(JSON.stringify(out, null, 2))
        toast(ok ? `Copied ${Object.keys(out).length} entries as JSON` : 'Copy failed')
      })

      /* ---------- theme preview ---------- */
      const root = document.documentElement
      document.getElementById('theme-toggle').addEventListener('click', () => {
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'
      })
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        root.dataset.theme = 'dark'
      }
    </script>
  </body>
</html>
